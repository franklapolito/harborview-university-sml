unique_name: harborview_university
object_type: model
label: Harborview University
description: 'Enrollment, retention and sponsored research for Harborview State University, a fictional
  three-campus flagship, defined once and served to every BI tool and AI agent. Three calendars share
  one Date Dimension: the Academic Calendar (Academic Year > Term) is the hierarchy for enrollment and
  retention, and a year''s headcount is its fall census; the Fiscal Calendar (1 July to 30 June) is for
  finance; sponsored awards run on their own award periods. Census Headcount and Census FTE are snapshots
  per term that take the FIRST term in any period (the fall census) and are never summed across terms.
  Retention and graduation rates divide by the first-time full-time cohort, never by all new first-years,
  and graduation rates divide only by cohorts old enough to observe. Grant burn is spend against the award
  period''s allotted budget. Data is as of 31 October 2026.'
visible: true
