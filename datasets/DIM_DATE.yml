description: 'One row per day, 2018-07-01 to 2027-06-30, carrying three calendars: academic (Academic
  Year > Term > Day), fiscal (1 July to 30 June, named for the year it ends in) and calendar. PRIOR_*
  keys hold the same term, quarter or month one year earlier and drive ParallelPeriod.'
